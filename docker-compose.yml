
services:
  postgres:
    image: postgres:17-alpine
    container_name: manahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: manahub
      POSTGRES_PASSWORD: manahubdev
      POSTGRES_DB: manahub
    ports:
      - "5434:5432"
    volumes:
      - manahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manahub -d manahub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  manahub_postgres_data:
